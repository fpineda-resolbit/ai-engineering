name: estimador-cag

on:
  push:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag.yml"
  pull_request:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: estimador-cag

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (estructura + API con LLM simulado)
        run: uv run pytest -v

      - name: Smoke test del servidor
        env:
          OPENAI_API_KEY: ""
        run: |
          python3 -c 'import json,sys; print(json.dumps({"transcription": open(sys.argv[1]).read()}))' transcripts/landing-hubspot.txt > request.json
          .venv/bin/uvicorn app.main:app --port 8000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          curl -sf localhost:8000/docs > /dev/null
          # Sin API key el endpoint debe responder 503 (cableado correcto, sin coste)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/estimate \
            -H 'Content-Type: application/json' -d @request.json)
          test "$code" = "503"

      - name: Estimación real con el LLM (solo si existe el secret ANTHROPIC_API_KEY)
        env:
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-haiku-5-5
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          python3 -c 'import json,sys; print(json.dumps({"transcription": open(sys.argv[1]).read()}))' transcripts/landing-hubspot.txt > request.json
          .venv/bin/uvicorn app.main:app --port 8001 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do curl -sf localhost:8001/health && break; sleep 1; done
          curl -sf -X POST localhost:8001/api/v1/estimate \
            -H 'Content-Type: application/json' -d @request.json \
            | tee response.json | python -c "import json,sys; d=json.load(sys.stdin); assert 'Estimación' in d['estimation'], d"
